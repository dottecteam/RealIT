services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: real-it-api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - /app/node_modules
      - db_data:/app/db
    restart: always

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: real-it-fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    volumes:
      - db_data:/app/db
    depends_on:
      - api
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: real-it-web
    ports:
      - "3001:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: always

volumes:
  db_data: